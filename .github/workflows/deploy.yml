name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build
        env:
          VITE_LOGIN_USER_1: ${{ secrets.VITE_LOGIN_USER_1 }}
          VITE_LOGIN_PASSWORD_1: ${{ secrets.VITE_LOGIN_PASSWORD_1 }}
          VITE_LOGIN_USER_2: ${{ secrets.VITE_LOGIN_USER_2 }}
          VITE_LOGIN_PASSWORD_2: ${{ secrets.VITE_LOGIN_PASSWORD_2 }}
        run: |
          if [ -z "$VITE_LOGIN_USER_1" ] || [ -z "$VITE_LOGIN_PASSWORD_1" ] || \
             [ -z "$VITE_LOGIN_USER_2" ] || [ -z "$VITE_LOGIN_PASSWORD_2" ]; then
            echo "::error::Configure all four login secrets in repository Actions secrets."
            exit 1
          fi
          npm run build
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
